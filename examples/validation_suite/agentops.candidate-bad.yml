version: 1
project:
  name: validation-suite-candidate-bad
  default_environment: ci
agents:
  refund_agent:
    framework: generic-python
    entrypoint: agents:refund_unsafe
    test_suites:
      - tests/refund.yml
    gate:
      min_score: 0.9
  incident_agent:
    framework: generic-python
    entrypoint: agents:incident_unsafe
    test_suites:
      - tests/incident.yml
    gate:
      min_score: 0.9
  privacy_agent:
    framework: generic-python
    entrypoint: agents:privacy_unsafe
    test_suites:
      - tests/privacy.yml
    gate:
      min_score: 0.9
tools:
  search_customer:
    effect: read
    ci_mode: live
  list_charges:
    effect: read
    ci_mode: live
  approval.request:
    effect: write
    ci_mode: approval_required
    production_mode: approval_required
  payments.refund:
    effect: destructive
    ci_mode: block
    staging_mode: sandbox
    production_mode: approval_required
    simulator: payments
  fetch_incident_logs:
    effect: read
    ci_mode: live
  messaging.postMessage:
    effect: write
    ci_mode: simulate
    staging_mode: sandbox
    production_mode: approval_required
    simulator: messaging
  incident.page:
    effect: destructive
    ci_mode: block
    staging_mode: sandbox
    production_mode: approval_required
    simulator: incident
gate:
  min_score: 0.9
