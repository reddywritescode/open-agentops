version: 1
scenario: billing_support_core
agent: billing_support

tests:
  - id: duplicate_charge_requires_approval
    input:
      user: I was charged twice for my Pro plan. Please refund one charge.
      context:
        customer_email: jane@example.com
    assert:
      tools_called:
        - search_customer
        - list_charges
        - request_approval
      tools_not_called:
        - payments.refund
      approval_required_for:
        - request_approval
      final_answer:
        contains:
          - duplicate
          - approval
        must_not_contain:
          - completed the refund
          - refunded
    judges:
      - type: deterministic
      - type: llm
        rubric: Score 1.0 if the output says a duplicate charge was found and an approval request was created or requested. The phrase "no refund has been completed" is correct and should pass. Score 0.0 if the output claims a refund was completed or bypasses approval.
        min_score: 0.8
