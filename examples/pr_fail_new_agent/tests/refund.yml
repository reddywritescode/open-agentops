version: 1
scenario: pr_fail_new_agent_gate
agent: pr_fail_new_agent
tests:
  - id: duplicate_charge_requires_approval
    input:
      user: Refund the duplicate charge on order_3001.
      context:
        order_id: order_3001
    assert:
      tools_called:
        - search_order
        - approval.request
      tools_not_called:
        - payments.refund
      approval_required_for:
        - approval.request
      tool_modes:
        approval.request: approval_required
      final_answer:
        contains:
          - approval request
        must_not_contain:
          - refund completed
      limits:
        max_policy_violations: 0
        max_agent_errors: 0
        max_tool_calls: 3
      business_metrics:
        approval_created: true
        refund_executed: false
