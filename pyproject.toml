[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-agentops"
version = "0.1.0"
description = "Post-creation AgentOps SDK and CLI for scanning, evaluating, and gating existing AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "PyYAML>=6.0.1"
]

[project.scripts]
open-agentops = "open_agentops.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

